
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Detalle del producto | Mr. Sandwich</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Kaushan+Script&family=Lobster&family=Open+Sans:wght@400;600;700;800&family=Roboto:wght@400;500&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="css/estilos.css">
</head>

<body data-pagina="producto">

    <!-- CABECERA -->

    <header class="cabecera">

        <a href="index.html" class="cabecera-marca">

            <img
                src="img/logo-circulo.jpg"
                alt="Logo Mr. Sandwich"
            >

            <span>Mr. Sandwich</span>

        </a>

        <div class="acciones">

            <button
                type="button"
                class="btn-pill btn-buscar"
                data-accion="buscar"
            >

                <svg viewBox="0 0 24 24" aria-hidden="true">
                    <circle cx="11" cy="11" r="7"/>
                    <path d="m20 20-4-4"/>
                </svg>

                Buscar producto

            </button>

            <a
                href="login.html"
                class="btn-pill btn-sesion"
                data-sesion
            >

                <span>Inicio de sesión</span>

                <svg viewBox="0 0 24 24" aria-hidden="true">
                    <path d="M5 12h14M13 6l6 6-6 6"/>
                </svg>

            </a>

        </div>

    </header>


    <!-- BÚSQUEDA -->

    <form
        class="barra-busqueda"
        role="search"
        action="index.html"
        hidden
    >

        <input
            type="search"
            name="q"
            placeholder="¿Qué se te antoja hoy?"
            aria-label="Buscar producto"
        >

        <button type="submit">
            Buscar
        </button>

        <button
            type="button"
            class="barra-cerrar"
            aria-label="Cerrar búsqueda"
        >
            &times;
        </button>

    </form>


    <!-- DETALLE DEL PRODUCTO -->

    <main class="detalle">

        <!-- INFORMACIÓN DEL PRODUCTO -->

        <section class="detalle-informacion">

            <img
                class="detalle-imagen"
                src=""
                alt="Imagen del producto"
            >

            <a
                href="index.html"
                class="detalle-volver"
            >
                ← Volver al menú
            </a>

            <h1 class="detalle-nombre">
                Cargando producto...
            </h1>

            <p class="detalle-precio"></p>

            <p class="detalle-descripcion"></p>

        </section>


        <!-- PERSONALIZACIÓN DEL PEDIDO -->

        <form class="pedido">

            <!-- OPCIONES DEL PRODUCTO -->

            <fieldset class="pedido-opciones">

                <legend class="visualmente-oculto">
                    Elige una opción
                </legend>

            </fieldset>


            <!-- INGREDIENTES ADICIONALES -->

            <h2 class="pedido-titulo">
                Personaliza tu pedido
            </h2>

            <ul class="pedido-extras"></ul>


            <!-- TOTAL -->

            <div class="pedido-total">

                <span>Total</span>

                <output data-total>
                    $0
                </output>

            </div>


            <!-- BOTÓN DEL PEDIDO -->

            <button
                type="submit"
                class="pedido-boton"
            >
                Agregar a mi pedido
            </button>

        </form>

    </main>


    <!-- MENSAJE DE CONFIRMACIÓN -->

    <div
        class="aviso"
        role="status"
        aria-live="polite"
        hidden
    ></div>


    <!-- JAVASCRIPT -->

    <script src="js/datos.js"></script>
    <script src="js/app.js"></script>

</body>
</html>
