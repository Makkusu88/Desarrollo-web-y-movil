<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar sesión | Mr. Sandwich</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Kaushan+Script&family=Lobster&family=Open+Sans:wght@400;600;700;800&family=Roboto:wght@400;500&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/estilos.css">
</head>
<body data-pagina="login" class="pagina-login">

    <main class="login">
        <a href="index.html" class="login-logo">
            <img src="img/logo-mr-sandwich.webp" alt="Mr. Sandwich - volver al inicio">
        </a>

        <img class="login-deco login-deco-izq" src="img/hamburguesa-papas.webp" alt="">
        <img class="login-deco login-deco-der" src="img/sliders.webp" alt="">

        <section class="login-tarjeta">
            <img class="login-escudo" src="img/escudo.webp" alt="">
            <h1 class="login-titulo">Mr. Sandwich</h1>
            <p class="login-texto" data-texto="subtitulo">Inicie sesión para acceder a sus <strong>Beneficios reales</strong></p>

            <form class="login-form" novalidate>
                <div class="campo">
                    <input type="text" id="usuario" name="usuario" autocomplete="username" data-placeholder="usuario" placeholder="Nombre de pila o Email*" required>
                    <small class="campo-error" data-error="usuario"></small>
                </div>
                <div class="campo">
                    <input type="password" id="clave" name="clave" autocomplete="current-password" data-placeholder="clave" placeholder="Contraseña*" required>
                    <small class="campo-error" data-error="clave"></small>
                </div>
                <button type="button" class="login-olvido" data-texto="olvido">He olvidado mi contraseña</button>
                <p class="login-mensaje" role="status" aria-live="polite" hidden></p>
                <button type="submit" class="login-boton" data-texto="boton">Iniciar sesión</button>
            </form>

            <label class="idioma">
                <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3c2.5 2.7 3.8 5.7 3.8 9s-1.3 6.3-3.8 9c-2.5-2.7-3.8-5.7-3.8-9S9.5 5.7 12 3z"/></svg>
                <select name="idioma" aria-label="Idioma">
                    <option value="es">Español</option>
                    <option value="en">English</option>
                </select>
            </label>
        </section>
    </main>

    <script src="js/datos.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
