<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mr. Sandwich</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Kaushan+Script&family=Lobster&family=Open+Sans:wght@400;600;700;800&family=Roboto:wght@400;500&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/estilos.css">
</head>
<body data-pagina="inicio">

    <header class="hero">
        <img class="hero-banner" src="img/banner.jpg" alt="Mr. Sandwich">
        <div class="acciones">
            <button type="button" class="btn-pill btn-buscar" data-accion="buscar">
                <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-4-4"/></svg>
                Buscar producto
            </button>
            <a href="login.html" class="btn-pill btn-sesion" data-sesion>
                <span>Inicio de sesión</span>
                <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"/></svg>
            </a>
        </div>
    </header>

    <form class="barra-busqueda" role="search" hidden>
        <input type="search" name="q" placeholder="¿Qué se te antoja hoy?" aria-label="Buscar producto">
        <button type="button" class="barra-cerrar" aria-label="Cerrar búsqueda">&times;</button>
    </form>

    <section class="marca">
        <img class="logo-circulo" src="img/logo-circulo.jpg" alt="Logo Mr. Sandwich">
        <h1 class="marca-titulo">Mr.sandwich</h1>
        <nav class="categorias" aria-label="Categorías"></nav>
    </section>

    <main class="catalogo">
        <p class="catalogo-estado" hidden></p>
        <div class="grilla-productos"></div>
    </main>

    <footer class="pie">
        <img class="pie-logo" src="img/logo-circulo.jpg" alt="Logo Mr. Sandwich">
        <ul class="redes">
            <li>
                <a href="#" aria-label="Instagram">
                    <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="3" width="18" height="18" rx="5"/><circle cx="12" cy="12" r="4"/><circle cx="17.5" cy="6.5" r="1" class="relleno"/></svg>
                    <span>Instagram</span>
                </a>
            </li>
            <li>
                <a href="#" aria-label="WhatsApp">
                    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 20l1.3-4A8.5 8.5 0 1 1 8.2 19z"/><path d="M9 8.5c0 3.5 3 6.5 6.5 6.5l1-1.5-2-1-1 1c-1.2-.5-2.5-1.8-3-3l1-1-1-2z" class="relleno"/></svg>
                    <span>whatsapp</span>
                </a>
            </li>
            <li>
                <a href="#" aria-label="Facebook">
                    <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M13 21v-8h2.5l.5-3h-3V8.5c0-.8.4-1.5 1.5-1.5H16V4.5c-.5 0-1.3-.1-2.2-.1C11.6 4.4 10 5.7 10 8v2H7.5v3H10v8"/></svg>
                    <span>Facebook</span>
                </a>
            </li>
            <li>
                <a href="#" aria-label="Gmail">
                    <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="m3 7 9 6 9-6"/></svg>
                    <span>Gmail</span>
                </a>
            </li>
        </ul>
    </footer>

    <div class="aviso" role="status" aria-live="polite" hidden></div>

    <script src="js/datos.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
